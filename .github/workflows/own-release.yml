name: own-release
# The shared copy holds the name release.yml in this same directory.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      publish-command: bun release/major-tag.ts
      github-release: true
