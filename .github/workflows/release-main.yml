name: release-main
on:
  workflow_call:
    inputs:
      check-release:
        description: Whether lint, build, the build diff check, and typecheck run before release.
        type: boolean
        default: false
      secrets-pack:
        description: Whether lint reads the private secrets pack the caller passes as the CHECKS_SECRETS_PACK secret.
        type: boolean
        default: false
      publish-workspaces:
        description: Publish public workspace packages from a private root after the full release suite.
        type: boolean
        default: false
      full-test:
        description: Whether a push of a release commit runs bun run test --full before the tag and the publish.
        type: boolean
        default: false
    secrets:
      CHECKS_SECRETS_PACK:
        required: false
permissions:
  contents: read
jobs:
  static:
    if: inputs.check-release
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - if: inputs.secrets-pack
        uses: avi2d/workflows/actions/secrets-pack@v3
        with:
          pack: ${{ secrets.CHECKS_SECRETS_PACK }}
      - run: bun run lint
      - run: bun run build
      - run: git diff --exit-code
      - run: bun run typecheck
  suite:
    if: "(inputs.full-test || inputs.publish-workspaces) && startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - name: run the full test suite on the release commit
        run: bun run test --full
  release:
    needs: [suite, static]
    if: ${{ !cancelled() && (needs.suite.result == 'success' || needs.suite.result == 'skipped') && (needs.static.result == 'success' || needs.static.result == 'skipped') }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: read
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          fetch-depth: "0"
      # npm takes a trusted publish only from the Node it set up with its registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_PUBLISH_WORKSPACES: ${{ inputs.publish-workspaces }}
        run: bunx checks-release-tag
