name: release-main
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: read
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          fetch-depth: "0"
      # npm takes a trusted publish only from the Node it set up with its registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-release-tag
