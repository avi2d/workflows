name: release-main
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: read
    steps:
      # A ./actions reference resolves in the caller's checkout, so each action is pinned to a commit of main that holds it.
      - uses: avi2d/workflows/actions/setup@438d3e2b51a5e69e55cc12693b1f6c6bf35af93d
        with:
          fetch-depth: "0"
      # npm takes a trusted publish only from the Node it set up with its registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-release-tag
