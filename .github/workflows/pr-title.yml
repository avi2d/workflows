name: pr-title

# Separate from ci.yml, so a title edit reruns only this, not the whole suite.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    if: github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-commit-title
      # Branch protection needs a commitlint check; no job has that name.
      - name: report the title as commitlint
        if: always()
        uses: ./commitlint-status
        with:
          outcome: ${{ steps.title.outcome }}
