name: runner
on:
  workflow_call:
    outputs:
      runs-on:
        description: ubuntu-latest while GitHub starts hosted jobs, else the caller's CI_RUNS_ON variable, else ubuntu-latest.
        value: ${{ jobs.hosted-minutes.outputs.runs-on || vars.CI_RUNS_ON || 'ubuntu-latest' }}
permissions:
  contents: read
jobs:
  # Billing needs org admin scope, so a hosted job starting stands in for it.
  # Out of minutes, the job fails at once instead of queueing; continue-on-error keeps that off the caller.
  hosted-minutes:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 1
    outputs:
      runs-on: ${{ steps.started.outputs.runs-on }}
    steps:
      - id: started
        run: echo "runs-on=ubuntu-latest" >> "$GITHUB_OUTPUT"
