name: runner
on:
  workflow_call:
    inputs:
      draft-hold:
        description: Whether to cancel the run a push to a draft pull request started, so the caller's checks wait until someone starts them by hand.
        type: boolean
        default: false
    outputs:
      runs-on:
        description: The caller's CI_RUNS_ON variable when set, else ubuntu-latest.
        value: ${{ vars.CI_RUNS_ON || jobs.hosted-minutes.outputs.runs-on || 'ubuntu-latest' }}
jobs:
  draft-hold:
    if: ${{ inputs.draft-hold && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.draft == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: avi2d/workflows/actions/draft-hold@v2
  # A hosted job refused for want of minutes fails before any step, so continue-on-error cannot keep it off the check list.
  hosted-minutes:
    if: ${{ !vars.CI_RUNS_ON }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      runs-on: ubuntu-latest
    steps:
      - run: echo hosted runner started
  # Without a job that runs, a caller with CI_RUNS_ON set would see its runner job skipped.
  pick:
    if: ${{ vars.CI_RUNS_ON }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - run: 'echo "runner pick: $RUNS_ON"'
        env:
          RUNS_ON: ${{ vars.CI_RUNS_ON }}
