name: runner
on:
  workflow_call:
    outputs:
      runs-on:
        description: The caller's CI_RUNS_ON variable when set, else ubuntu-latest.
        value: ${{ vars.CI_RUNS_ON || jobs.hosted-minutes.outputs.runs-on || 'ubuntu-latest' }}
permissions:
  contents: read
jobs:
  # A hosted job refused for want of minutes fails before any step, so continue-on-error cannot keep it off the check list.
  hosted-minutes:
    if: ${{ !vars.CI_RUNS_ON }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 1
    outputs:
      runs-on: ${{ steps.started.outputs.runs-on }}
    steps:
      - id: started
        run: echo "runs-on=ubuntu-latest" >> "$GITHUB_OUTPUT"
