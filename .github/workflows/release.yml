name: release
on:
  workflow_call:
    inputs:
      package-path:
        description: The manifest holding the released version, relative to the repository root.
        type: string
        default: ./package.json
      preflight-command:
        description: The fail-fast check that runs before publishing, empty to skip.
        type: string
        default: ""
      tree-guard-command:
        description: The check that the tagged tree matches the tested pull request tree, empty to skip.
        type: string
        default: ""
      build-command:
        description: The build the tag runs, empty to skip.
        type: string
        default: bun run build
      clean-tree-command:
        description: The check that the tag tree is clean, empty to skip.
        type: string
        default: git diff --exit-code
      lint-command:
        description: The lint the tag runs, empty to skip.
        type: string
        default: ""
      typecheck-command:
        description: The typecheck the tag runs, empty to skip.
        type: string
        default: ""
      test-command:
        description: The test suite the tag runs, empty when the release pull request already ran it.
        type: string
        default: ""
      node-version:
        description: The Node release to set up with the npm registry, empty to skip.
        type: string
        default: ""
      publish-command:
        description: The command that publishes the tag, empty to skip.
        type: string
        default: ""
      github-release:
        description: Whether to create the GitHub release for the tag after the publish command, with the CHANGELOG.md section of its version as the notes.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preflight:
    if: inputs.preflight-command != ''
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # A ./actions/setup reference resolves in the caller's checkout, which holds no setup action.
      - uses: avi2d/workflows/actions/setup@4ac751c064c28d79887b28005c0d1a7e2c0c6488 # v2.0.0
        with:
          fetch-depth: 0
      - name: fail fast when the release cannot run
        run: ${{ inputs.preflight-command }}
  verify:
    needs: preflight
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: ref is a tag
        run: test "$GITHUB_REF_TYPE" = tag
      # A ./actions/setup reference resolves in the caller's checkout, which holds no setup action.
      - uses: avi2d/workflows/actions/setup@4ac751c064c28d79887b28005c0d1a7e2c0c6488 # v2.0.0
        with:
          fetch-depth: 0
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: landed tree matches the tested pull request tree
        if: inputs.tree-guard-command != ''
        run: ${{ inputs.tree-guard-command }}
      - name: build the tag
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: the tag tree is clean
        if: inputs.clean-tree-command != ''
        run: ${{ inputs.clean-tree-command }}
      - name: lint the tag
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
      - name: typecheck the tag
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}
      - name: test the tag
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
      - name: tag matches package version
        uses: avi2d/workflows/actions/release-version@3dc7515f3ccf65e333eba3c8a9b358533d081430 # v2.1.0
        with:
          package-path: ${{ inputs.package-path }}
  # Only this job holds the publish token, so no lint, test or caller check runs beside it.
  publish:
    needs: verify
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      # A ./actions/setup reference resolves in the caller's checkout, which holds no setup action.
      - uses: avi2d/workflows/actions/setup@4ac751c064c28d79887b28005c0d1a7e2c0c6488 # v2.0.0
        with:
          fetch-depth: 0
      # The shared copy cannot know which paths the caller's build writes, so it builds the verified tag again in place of carrying an artifact.
      - name: require publish-command or github-release
        if: inputs.publish-command == '' && !inputs.github-release
        run: echo "publish-command is empty and github-release is false; set publish-command or github-release to publish the release" >&2 && exit 1
      - name: build the tag
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: the tag tree is clean
        if: inputs.clean-tree-command != ''
        run: ${{ inputs.clean-tree-command }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: publish the release
        if: inputs.publish-command != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ inputs.publish-command }}
      - id: version
        name: read the released version for the notes
        if: inputs.github-release
        uses: avi2d/workflows/actions/release-version@3dc7515f3ccf65e333eba3c8a9b358533d081430 # v2.1.0
        with:
          package-path: ${{ inputs.package-path }}
      - if: inputs.github-release
        uses: avi2d/workflows/actions/kit-bin@3dc7515f3ccf65e333eba3c8a9b358533d081430 # v2.1.0
        with:
          commands: checks-release-notes
      - name: write the release notes
        if: inputs.github-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: checks-release-notes "$VERSION" "$RUNNER_TEMP/release-notes.md"
      - name: create the GitHub release
        if: inputs.github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
