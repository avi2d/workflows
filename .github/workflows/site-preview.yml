name: site-preview
on:
  workflow_call:
    inputs:
      pages:
        description: The Cloudflare Pages project that stages the site, whose previews go to the <pages>-preview project.
        required: true
        type: string
      path:
        description: The folder bun run build:site writes, which the job deploys and uploads as the site-dist artifact.
        type: string
        default: dist
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
permissions:
  contents: read
jobs:
  address:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      origin: ${{ steps.preview.outputs.origin }}
      preview: ${{ steps.site.outputs.preview }}
    steps:
      - id: secrets
        uses: avi2d/workflows/actions/preview-secrets-check@v3
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          missing-note: the Cloudflare secrets are not set, so this run deploys no preview
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - id: site
        uses: avi2d/workflows/actions/site-names@v3
        with:
          pages: ${{ inputs.pages }}
      - id: preview
        if: steps.secrets.outputs.set == 'true' && github.event_name == 'pull_request'
        uses: avi2d/workflows/actions/preview-address@v3
        with:
          project: ${{ steps.site.outputs.preview }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  build:
    needs: address
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: "false"
      - env:
          VITE_PREVIEW_ORIGIN: ${{ needs.address.outputs.origin }}
        run: bun run build:site
      - run: bunx checks-lint --stage built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-dist
          path: ${{ inputs.path }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: [address, build]
    if: needs.address.outputs.origin != ''
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site-dist
          path: ${{ runner.temp }}/site-dist
      - uses: avi2d/workflows/actions/preview-deploy@v3
        with:
          project: ${{ needs.address.outputs.preview }}
          origin: ${{ needs.address.outputs.origin }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          directory: ${{ runner.temp }}/site-dist
          commit-dirty: "true"
      - uses: avi2d/workflows/actions/preview-comment@v3
        with:
          origin: ${{ needs.address.outputs.origin }}
          marker: <!-- ${{ needs.address.outputs.preview }} -->
