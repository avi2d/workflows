name: site-production
on:
  workflow_call:
    inputs:
      pages:
        required: true
        type: string
      domain:
        required: true
        type: string
      production:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      PRODUCTION_DEPLOY_KEY:
        required: true
permissions:
  contents: read
jobs:
  production:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: site-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      # The gate runs from the dispatched commit, since a release commit can predate it.
      - uses: avi2d/workflows/actions/setup@v3
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - id: site
        uses: avi2d/workflows/actions/site-names@v3
        with:
          pages: ${{ inputs.pages }}
          domain: ${{ inputs.domain }}
          production: ${{ inputs.production }}
      - id: staging
        uses: avi2d/workflows/actions/pages-staged-commit@v3
        with:
          project: ${{ steps.site.outputs.pages }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          deploy-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          workflow: main.yml
      - name: refuse a staged commit that is not a published release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.staging.outputs.sha }}
        run: bunx checks-production-gate "$SHA"
      - env:
          SHA: ${{ steps.staging.outputs.sha }}
        run: git checkout --detach "$SHA"
      - run: bun install --frozen-lockfile
      - uses: avi2d/workflows/actions/heavy-slot@v3
        with:
          action: acquire
          runner-prefix: ${{ vars.HEAVY_SLOT_RUNNER_PREFIX }}
          command: ${{ vars.HEAVY_SLOT_COMMAND }}
      - uses: avi2d/workflows/actions/playwright@v3
      - name: run the full test suite on the release commit
        run: bun run test --full
      - name: run the pixel screenshots on the release commit
        run: bun run test:pixel
      - if: always()
        uses: avi2d/workflows/actions/heavy-slot@v3
        with:
          action: release
          runner-prefix: ${{ vars.HEAVY_SLOT_RUNNER_PREFIX }}
          command: ${{ vars.HEAVY_SLOT_COMMAND }}
      - run: bun run build:production
      - uses: avi2d/workflows/actions/pages-publish@v3
        with:
          repository: ${{ steps.site.outputs.production }}
          deploy-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          cname: ${{ steps.site.outputs.domain }}
          source-sha: ${{ steps.staging.outputs.sha }}
          commit-message: Production build of ${{ github.repository }} main
          path: production-pages
      - uses: avi2d/workflows/actions/pages-served@v3
        with:
          origin: ${{ steps.site.outputs.production-origin }}
      - uses: avi2d/workflows/actions/lighthouse@v3
        with:
          site: dist
          origin: ${{ steps.site.outputs.production-origin }}
