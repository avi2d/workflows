name: release-pr
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release-pr:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: release-pull-request
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # A rerun plans the branch tip, not the commit the dispatch named.
      - uses: avi2d/workflows/actions/setup@v3
        with:
          ref: ${{ github.ref }}
          fetch-depth: "0"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-release-pr ci.yml
      - uses: avi2d/workflows/actions/held-runs@v3
