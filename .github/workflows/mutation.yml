name: mutation
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-seed-trial
  cancel-in-progress: true

env:
  RUNNER_ENVIRONMENT: github-hosted
  CHECKS_SHA: 2cdadbdce96946ec38bab96044353aebb1aafc06

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: avi2d/checks
          ref: ${{ env.CHECKS_SHA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Fetch the 9 Nov full report for the shard weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42605254612 --repo avi2d/checks --name mutation-baseline-full --dir "$RUNNER_TEMP/last-full"
      - id: shards
        name: Split the tree into shards
        run: bun src/testing/mutation-scope.ts --shards 4 "$RUNNER_TEMP/last-full/mutation.json" | sed -n 's/^SHARDS=/shards=/p' >> "$GITHUB_OUTPUT"

  full-shard:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: avi2d/checks
          ref: ${{ env.CHECKS_SHA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run one shard from nothing, static mutants included
        env:
          SHARD: ${{ matrix.shard }}
        run: bunx stryker run --mutate "$SHARD"
      - env:
          INDEX: ${{ strategy.job-index }}
        run: mv reports/mutation/mutation.json "reports/mutation/shard-$INDEX.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial2-full-shard-${{ strategy.job-index }}
          path: reports/mutation/shard-${{ strategy.job-index }}.json
          retention-days: 7
          if-no-files-found: error

  full-merge:
    needs: full-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: avi2d/checks
          ref: ${{ env.CHECKS_SHA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trial2-full-shard-*
          path: shards
          merge-multiple: true
      - run: bun src/testing/mutation-merge.ts reports/mutation/mutation.json shards/shard-*.json
      - run: bun src/testing/mutation-baseline.ts --slim reports/mutation/mutation.json "$RUNNER_TEMP/full/mutation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial2-merged-slim
          path: ${{ runner.temp }}/full/
          retention-days: 7
          if-no-files-found: error

  seeded-baseline:
    needs: full-merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: avi2d/checks
          ref: ${{ env.CHECKS_SHA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trial2-merged-slim
          path: ${{ runner.temp }}/seed
      - name: Use the merged shard report as the incremental file
        run: mkdir -p reports && cp "$RUNNER_TEMP/seed/mutation.json" reports/stryker-incremental.json
      - name: Run the whole tree incremental in one job
        run: bunx stryker run --incremental
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial2-seeded-baseline
          path: reports/mutation/mutation.json
          retention-days: 7
