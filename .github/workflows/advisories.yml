name: advisories
on:
  workflow_call:
  schedule:
    - cron: "35 5 * * 1"
permissions:
  contents: read
  issues: write
jobs:
  advisories:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # A ./setup reference resolves in the caller's checkout, which holds no setup action.
      - uses: avi2d/workflows/setup@ec7221448380177b37ddba9a159ea9ceb09c1781 # v1.1.2
        with:
          persist-credentials: "false"
      # The kit repository holds the scan as source and never installs its own bin.
      - name: run the scan from the kit install, else from the kit source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -e ./node_modules/.bin/checks-advisories ]; then
            exec ./node_modules/.bin/checks-advisories --all --issue
          elif [ -f src/dependencies/advisories.ts ]; then
            exec bun src/dependencies/advisories.ts --all --issue
          else
            echo "::error::advisories needs @avi2dg/checks in the caller's devDependencies, or the kit's own src/dependencies/advisories.ts"
            exit 1
          fi
