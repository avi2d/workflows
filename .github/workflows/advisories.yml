name: advisories
on:
  workflow_call:
  schedule:
    - cron: "35 5 * * 1"
permissions:
  contents: read
  issues: write
jobs:
  advisories:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # A ./setup reference resolves in the caller's checkout, which holds no setup action.
      - uses: avi2d/workflows/setup@3dc7515f3ccf65e333eba3c8a9b358533d081430 # v2.1.0
        with:
          persist-credentials: "false"
      - uses: avi2d/workflows/kit-bin@8ddfb15dbc33ba16d67c49cccf1976e8d1cfcf04
        with:
          commands: checks-advisories
      - name: run the scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: checks-advisories --all --issue
