name: flake
on:
  workflow_call:
    inputs:
      runs:
        description: How many times checks-flake runs the suite.
        type: string
        default: "10"
      claude-version:
        description: The exact Claude Code version to install before the suite, empty to skip.
        type: string
        default: ""
      node-version-file:
        description: The file naming the Node version to set up before the suite, such as .node-version. Empty sets up no Node.
        type: string
        default: ""
permissions:
  contents: read
jobs:
  flake:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - if: inputs.node-version-file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - if: inputs.claude-version != ''
        env:
          CLAUDE_VERSION: ${{ inputs.claude-version }}
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_VERSION"
      - uses: avi2d/workflows/actions/heavy-slot@v3
        with:
          action: acquire
          runner-prefix: ${{ vars.HEAVY_SLOT_RUNNER_PREFIX }}
          command: ${{ vars.HEAVY_SLOT_COMMAND }}
      - env:
          RUNS: ${{ inputs.runs }}
        run: bunx checks-flake --runs "$RUNS" --report flake-report.json
      - if: always()
        uses: avi2d/workflows/actions/heavy-slot@v3
        with:
          action: release
          runner-prefix: ${{ vars.HEAVY_SLOT_RUNNER_PREFIX }}
          command: ${{ vars.HEAVY_SLOT_COMMAND }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-report
          path: flake-report.json
          retention-days: 7
          if-no-files-found: ignore
