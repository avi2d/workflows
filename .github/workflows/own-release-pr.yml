name: own-release-pr
# The shared copies hold the names release-pr.yml and release-pr-v2.yml in this same directory.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-pr:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/release-pr-v2.yml
    with:
      preflight-command: bunx checks-release-preflight own-release.yml
      plan-command: bunx checks-release-pr own-ci.yml
      tag-command: bunx checks-release-tag own-release.yml
