name: ci
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      statuses: write
      pull-requests: read
    steps:
      # A ./actions reference resolves in the caller's checkout, so each action is pinned to a commit of main that holds it.
      - uses: avi2d/workflows/actions/draft-hold@438d3e2b51a5e69e55cc12693b1f6c6bf35af93d
      - uses: avi2d/workflows/actions/setup@438d3e2b51a5e69e55cc12693b1f6c6bf35af93d
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: "false"
      - run: bunx checks-workflows
      # The title reaches branch protection as the commitlint status, which pr-title.yml rewrites on an edit, so a bad title leaves this job green.
      - id: title
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-commit-title
      - uses: avi2d/workflows/actions/commitlint-status@438d3e2b51a5e69e55cc12693b1f6c6bf35af93d
        with:
          outcome: ${{ steps.title.outcome }}
          attempts: "5"
      - run: bun run build
      - run: git diff --exit-code
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx checks-test --pr
      # GitHub keeps a dispatched run's check off the pull request, so the release pull request reads this status.
      - if: always() && github.event_name == 'workflow_dispatch'
        uses: avi2d/workflows/actions/head-status@438d3e2b51a5e69e55cc12693b1f6c6bf35af93d
        with:
          job-status: ${{ job.status }}
          attempts: "5"
