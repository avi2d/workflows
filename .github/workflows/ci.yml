name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  # The title lookup on a dispatched run needs pull request read access.
  pull-requests: read

# Dispatched runs get a group of their own, so nothing cancels them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The head, not the merge ref, so the gates read the commit the range ends at.
      # Whole history: the range starts where the head branched off the base.
      - id: setup
        uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-commit-title
      # Branch protection needs a commitlint check; no job has that name.
      - name: report the title as commitlint
        if: always()
        uses: ./commitlint-status
        with:
          outcome: ${{ steps.title.outcome }}
      - name: a commitlint status that disagrees with the title lint fails
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.title.outcome }}
        run: |
          want=failure
          if [ "$OUTCOME" = success ]; then want=success; fi
          # The statuses list can lag the write, so an empty read waits.
          for _ in 1 2 3 4 5 6; do
            got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" --jq '[.[] | select(.context == "commitlint")][0].state')
            if [ -n "$got" ] && [ "$got" != null ]; then break; fi
            sleep 5
          done
          echo "commitlint status: $got, title lint: $OUTCOME"
          test "$got" = "$want"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: lint the workflows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Without ref, a pull request checks out GitHub's merge commit, not the head.
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          cache: "true"
      - name: a shallow checkout or a commit other than the asked one fails
        env:
          WANT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$WANT"
      - name: a Bun other than the one .bun-version names fails
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - name: missing or relocked dependencies fail
        run: |
          test -x node_modules/.bin/checks-docs-only
          git diff --exit-code
  gitleaks-cache-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: a kit that cannot fetch or run its pinned gitleaks fails
        run: bunx checks-secrets HEAD
  gitleaks-cache:
    # The fill job's cache save runs in its post step, which ends before this job starts.
    needs: gitleaks-cache-fill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: a gitleaks the next job has to download again fails
        run: |
          find ~/.cache/avi2dg-checks/gitleaks -type f -name gitleaks
          test -n "$(find ~/.cache/avi2dg-checks/gitleaks -type f -name gitleaks -perm -u+x)"
  docs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: commits
        name: commit a docs change, then a code change
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo smoke >> README.md
          git commit -qam "docs: smoke"
          echo "docs=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo smoke > smoke.txt
          git add smoke.txt
          git commit -qm "chore: smoke"
          echo "code=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: docs
        uses: ./docs-only
        with:
          base: ${{ steps.commits.outputs.base }}
          head: ${{ steps.commits.outputs.docs }}
      - id: code
        uses: ./docs-only
        with:
          base: ${{ steps.commits.outputs.docs }}
          head: ${{ steps.commits.outputs.code }}
      - id: none
        uses: ./docs-only
        with:
          base: ""
      - name: a code change read as docs-only or a README change read as code fails
        env:
          DOCS: ${{ steps.docs.outputs.docs-only }}
          CODE: ${{ steps.code.outputs.docs-only }}
          NONE: ${{ steps.none.outputs.docs-only }}
        run: |
          echo "docs=$DOCS code=$CODE none=$NONE"
          test "$DOCS" = true
          test "$CODE" = false
          test "$NONE" = false
  head-status:
    # A dispatched run's status lands on the head, where a failure shows on the pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./head-status
        with:
          job-status: success
          context: smoke/head-status-success
      - uses: ./head-status
        with:
          job-status: cancelled
          context: smoke/head-status-cancelled
          attempts: "2"
      - name: a cancelled job reported as success fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state() {
            # The statuses list can lag the write, so an empty read waits.
            for _ in 1 2 3 4 5 6; do
              got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --jq "[.[] | select(.context == \"$1\")][0].state")
              if [ -n "$got" ] && [ "$got" != null ]; then break; fi
              sleep 5
            done
            echo "$got"
          }
          test "$(state smoke/head-status-success)" = success
          test "$(state smoke/head-status-cancelled)" = failure
      - uses: ./head-status
        with:
          job-status: success
          context: smoke/head-status-head-sha
          head-sha: ${{ github.event.pull_request.head.sha }}
          description: the chosen head and description
      - name: a status written to GITHUB_SHA in place of the chosen head, or without its description, fails
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The statuses list can lag the write, so an empty read waits.
          for _ in 1 2 3 4 5 6; do
            got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" --jq '[.[] | select(.context == "smoke/head-status-head-sha")][0] | "\(.state) \(.description)"')
            if [ -n "$got" ] && [ "$got" != "null null" ]; then break; fi
            sleep 5
          done
          echo "status on the head: $got"
          test "$got" = "success the chosen head and description"
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./playwright
        with:
          browsers: webkit
      - name: a webkit that cannot open a page fails
        run: |
          bun -e "
            const { webkit } = require('playwright-core');
            const browser = await webkit.launch();
            const page = await browser.newPage();
            await page.setContent('<title>smoke</title>');
            const title = await page.title();
            await browser.close();
            if (title !== 'smoke') throw new Error('webkit read the title as ' + title);
          "
  heavy-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: put a stand-in slot command on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/heavy-slot-stub" <<'EOF'
          #!/bin/sh
          echo "$1" >> "$RUNNER_TEMP/heavy-slot.log"
          EOF
          chmod +x "$RUNNER_TEMP/bin/heavy-slot-stub"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ./heavy-slot
        with:
          action: acquire
          runner-prefix: ${{ runner.name }}
          command: heavy-slot-stub
      - uses: ./heavy-slot
        with:
          action: acquire
          runner-prefix: no-such-runner-
          command: heavy-slot-stub
      - uses: ./heavy-slot
        with:
          action: release
          runner-prefix: ${{ runner.name }}
          command: heavy-slot-stub
      - id: unknown
        uses: ./heavy-slot
        continue-on-error: true
        with:
          action: take
          runner-prefix: ${{ runner.name }}
          command: heavy-slot-stub
      - name: a slot call on another runner or an unknown action that passes fails
        env:
          UNKNOWN: ${{ steps.unknown.outcome }}
        run: |
          cat "$RUNNER_TEMP/heavy-slot.log"
          test "$(cat "$RUNNER_TEMP/heavy-slot.log")" = "$(printf 'acquire\nrelease')"
          test "$UNKNOWN" = failure
  kit-bin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: map a command to its source the way the kit's own package.json does
        run: bun ci/kit-bin-smoke.ts fixture
      - uses: ./kit-bin
        with:
          commands: checks-docs-only smoke-kit-source
      - id: missing
        uses: ./kit-bin
        continue-on-error: true
        with:
          commands: no-such-kit-command
      - name: a command off the shims, a source command that does not run, or a missing command that passes fails
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: bun ci/kit-bin-smoke.ts verify
  mutation-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: put stand-in mutation commands on the PATH
        run: bun ci/mutation-scope-smoke.ts stand-ins
      - uses: ./mutation-scope
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
      - name: a scope taken from anything but the merge base with main fails
        run: bun ci/mutation-scope-smoke.ts verify
  secrets-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A term written out here would be in the scanned commit, so the scan would refuse it.
      - id: pack
        name: build a pack whose term no tracked file holds
        run: printf 'json={"names":["%b"]}\n' 'smoke\x2dpack\x2dterm' >> "$GITHUB_OUTPUT"
      - uses: ./secrets-pack
        with:
          pack: ${{ steps.pack.outputs.json }}
      - name: a pack written anywhere but RUNNER_TEMP/secrets-pack.json, or changed on the way, fails
        env:
          PACK: ${{ steps.pack.outputs.json }}
        run: |
          test "$CHECKS_SECRETS_PACK" = "$RUNNER_TEMP/secrets-pack.json"
          printf '%s' "$PACK" | cmp - "$CHECKS_SECRETS_PACK"
      - name: a pack the kit's secret scan does not read fails
        run: bunx checks-secrets HEAD | grep -F 'the private pack CHECKS_SECRETS_PACK names ran'
      - id: empty
        uses: ./secrets-pack
        continue-on-error: true
        with:
          pack: ""
      - name: an empty pack that passes fails
        env:
          EMPTY: ${{ steps.empty.outcome }}
        run: test "$EMPTY" = failure
  checks:
    # Branch protection passes a skipped check, so this runs after a failed part and fails.
    needs: [static, setup, gitleaks-cache-fill, gitleaks-cache, docs-only, head-status, playwright, heavy-slot, kit-bin, mutation-scope, secrets-pack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: require every part
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: bun ci/require-parts.ts
      # A dispatched run's check stays off the pull request, so this reports a commit status.
      - name: report the result on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        uses: ./head-status
        with:
          job-status: ${{ job.status }}
