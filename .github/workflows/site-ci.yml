name: site-ci
on:
  workflow_call:
    inputs:
      pages:
        required: true
        type: string
      domain:
        required: true
        type: string
      production:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      statuses: write
      pull-requests: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: avi2d/workflows/actions/setup@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: "false"
      - run: bunx checks-workflows
      # The title reaches branch protection as the commitlint status, which pr-title.yml rewrites on an edit, so a bad title leaves this job green.
      - id: title
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-commit-title
      - uses: avi2d/workflows/actions/commitlint-status@v3
        with:
          outcome: ${{ steps.title.outcome }}
          attempts: "5"
      - run: bun run build
      - run: git diff --exit-code
      - id: site
        uses: avi2d/workflows/actions/site-names@v3
        with:
          pages: ${{ inputs.pages }}
          domain: ${{ inputs.domain }}
          production: ${{ inputs.production }}
      # A fork's or Dependabot's pull request runs without the repository secrets, so it gets no preview.
      - id: secrets
        uses: avi2d/workflows/actions/preview-secrets-check@v3
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          missing-note: the Cloudflare secrets are not set, so this run deploys no preview
      - id: preview
        if: steps.secrets.outputs.set == 'true' && github.event_name == 'pull_request'
        uses: avi2d/workflows/actions/preview-address@v3
        with:
          project: ${{ steps.site.outputs.preview }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - env:
          VITE_PREVIEW_ORIGIN: ${{ steps.preview.outputs.origin }}
        run: bun run build:site
      - if: steps.preview.outputs.origin != ''
        uses: avi2d/workflows/actions/preview-deploy@v3
        with:
          project: ${{ steps.site.outputs.preview }}
          origin: ${{ steps.preview.outputs.origin }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          commit-dirty: "true"
      - if: steps.preview.outputs.origin != ''
        uses: avi2d/workflows/actions/preview-comment@v3
        with:
          origin: ${{ steps.preview.outputs.origin }}
          marker: <!-- ${{ steps.site.outputs.preview }} -->
      - uses: avi2d/workflows/actions/draft-hold@v3
      - run: bun run lint
      - run: bun run typecheck
      - uses: avi2d/workflows/actions/heavy-slot@v3
        with:
          action: acquire
          runner-prefix: ${{ vars.HEAVY_SLOT_RUNNER_PREFIX }}
          command: ${{ vars.HEAVY_SLOT_COMMAND }}
      - uses: avi2d/workflows/actions/playwright@v3
      - run: bunx checks-test --pr
      - run: bunx checks-browser --pr
      - if: always()
        uses: avi2d/workflows/actions/heavy-slot@v3
        with:
          action: release
          runner-prefix: ${{ vars.HEAVY_SLOT_RUNNER_PREFIX }}
          command: ${{ vars.HEAVY_SLOT_COMMAND }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts
          path: artifacts/
          if-no-files-found: ignore
      # GitHub keeps a dispatched run's check off the pull request, so the release pull request reads this status.
      - if: always() && github.event_name == 'workflow_dispatch'
        uses: avi2d/workflows/actions/head-status@v3
        with:
          job-status: ${{ job.status }}
          context: checks / checks
          attempts: "5"
