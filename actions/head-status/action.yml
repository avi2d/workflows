name: head-status
description: Report a job's result as a commit status on the commit the run is for, or the one the caller names, since GitHub keeps a dispatched run's check off the pull request.
inputs:
  job-status:
    description: The job's status, passed as job.status. Only success reports success.
    required: true
  context:
    description: The status name, which a required check of the same name counts.
    default: ${{ github.job }}
  head-sha:
    description: The commit the status lands on. Empty falls back to GITHUB_SHA.
    default: ""
  description:
    description: The status description. Empty writes none.
    default: ""
  token:
    description: The token that writes the status. It needs statuses write.
    default: ${{ github.token }}
  attempts:
    description: How many times to try the status call, waiting 10 seconds longer after each failure.
    default: "1"
runs:
  using: composite
  steps:
    # The script resolves effect beside itself, and the caller's install holds it only by chance.
    - name: install the script's own dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --ignore-scripts --cwd "$GITHUB_ACTION_PATH/../.."
    - name: report the job status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        JOB_STATUS: ${{ inputs.job-status }}
        CONTEXT: ${{ inputs.context }}
        HEAD_SHA: ${{ inputs.head-sha }}
        DESCRIPTION: ${{ inputs.description }}
        ATTEMPTS: ${{ inputs.attempts }}
      run: bun "$GITHUB_ACTION_PATH/../../src/head-status/head-status.ts"
