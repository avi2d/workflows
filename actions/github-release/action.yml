name: github-release
description: Create the GitHub release for a tag, or update the one that exists, with the notes a file holds, and mark it latest only when its tag is the highest release version.
inputs:
  tag:
    description: The tag to release, as v<version>. Empty reads the tag the run was started on.
    default: ""
  notes-file:
    description: The file holding the release notes.
    required: true
  token:
    description: The token that writes the release. It needs contents write.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # The script resolves effect beside itself, and the caller's install holds it only by chance.
    - name: install the script's own dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --ignore-scripts --cwd "$GITHUB_ACTION_PATH"
    - name: create or update the GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
        NOTES_FILE: ${{ inputs.notes-file }}
      run: bun "$GITHUB_ACTION_PATH/main.ts"
