name: require-success
description: Fail unless each named result, such as a needed job's result, is success, or is skipped where the caller says the skip is expected.
inputs:
  results:
    description: The results to check, as name=result pairs separated by whitespace, such as e2e= followed by the e2e job's result.
    required: true
  skips:
    description: The expected skips, as name=true pairs separated by whitespace, such as e2e= followed by the output that says the change skips e2e. A named result that is skipped passes only when its pair here is true.
    default: ""
runs:
  using: composite
  steps:
    # A gate job may run this before setup, or without it.
    - id: bun
      name: tell whether the job already holds Bun
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../setup/main.sh" bun-held
    - if: steps.bun.outputs.held == 'false'
      name: fetch Bun through npm where the image holds no unzip
      shell: bash
      env:
        PINNED_BUN: ${{ steps.bun.outputs.version }}
      run: bash "$GITHUB_ACTION_PATH/../setup/main.sh" bun-without-unzip "$PINNED_BUN"
    - if: steps.bun.outputs.held == 'false'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun.outputs.version }}
    # The script resolves effect beside itself, and the caller's install holds it only by chance.
    - name: install the script's own dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --ignore-scripts --cwd "$GITHUB_ACTION_PATH"
    - name: require every result to be success
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        SKIPS: ${{ inputs.skips }}
      run: bun "$GITHUB_ACTION_PATH/main.ts"
