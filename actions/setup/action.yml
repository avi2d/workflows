name: setup
description: Check out the repository, install the Bun version its .bun-version names, install the locked dependencies and cache the gitleaks the kit pins.
inputs:
  fetch-depth:
    description: How many commits to fetch, 0 for the whole history.
    default: "1"
  ref:
    description: The commit, branch or tag to check out. Empty checks out the commit the event names.
    default: ""
  persist-credentials:
    description: Whether the checkout keeps the token in the git config for later git commands.
    default: "true"
  cache:
    description: Whether to restore and save the Bun install cache, keyed on bun.lock.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
    # Without the file, setup-bun falls back to the latest Bun, so the version drifts silently.
    - name: require .bun-version
      shell: bash
      run: |
        if [ ! -f .bun-version ]; then
          echo "::error file=.bun-version::setup needs a .bun-version file at the repository root"
          exit 1
        fi
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - shell: bash
      run: bun install --frozen-lockfile
    - name: cache the gitleaks the kit pins
      if: hashFiles('node_modules/@avi2dg/checks/src/delivery/gitleaks.ts') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/avi2dg-checks/gitleaks
        key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/@avi2dg/checks/src/delivery/gitleaks.ts') }}
