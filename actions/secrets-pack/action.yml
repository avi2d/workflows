name: secrets-pack
description: Write the private secrets pack to RUNNER_TEMP and export its path as CHECKS_SECRETS_PACK, so the kit's secret scans in later steps read it.
inputs:
  pack:
    description: The private pack's JSON, which the caller passes from its CHECKS_SECRETS_PACK secret. Empty fails the step.
    required: true
runs:
  using: composite
  steps:
    # The action's own checkout holds no node_modules, so write.ts would find no effect to import.
    - name: install the action's dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --cwd "$GITHUB_ACTION_PATH"
    - name: write the pack
      shell: bash
      env:
        PACK: ${{ inputs.pack }}
      run: bun "$GITHUB_ACTION_PATH/main.ts"
