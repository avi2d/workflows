name: preview-secrets-check
description: Tell whether the Cloudflare token and account ID reached the job, as the output set, so a job without them skips its Cloudflare steps.
inputs:
  api-token:
    description: The Cloudflare API token, passed from a secret the caller names. Empty reports set=false.
    default: ""
  account-id:
    description: The Cloudflare account ID, passed from a secret the caller names. Empty reports set=false.
    default: ""
  missing-note:
    description: The line the step prints when either is empty.
    default: the Cloudflare secrets are not set, so the Cloudflare steps skip
outputs:
  set:
    description: true when both are set, else false.
    value: ${{ steps.check.outputs.set }}
runs:
  using: composite
  steps:
    - id: check
      name: check the Cloudflare secrets are set
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        MISSING_NOTE: ${{ inputs.missing-note }}
      run: bash "$GITHUB_ACTION_PATH/main.sh"
