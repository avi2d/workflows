name: mutation-scope
description: Write the SCOPE of a pull request's mutation run to GITHUB_ENV, from the head's merge base with the branch the caller names.
inputs:
  base-ref:
    description: The branch the head merges into, read from origin. Empty means main.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The script resolves effect beside itself, and the caller's install of the kit holds it only by chance.
    - name: install the script's own dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --ignore-scripts --cwd "$GITHUB_ACTION_PATH"
    - name: select the mutation scope
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: bun "$GITHUB_ACTION_PATH/main.ts"
