name: heavy-slot
description: Take or free the machine's heavy slot around a heavy step, on runners whose name starts with a prefix the caller names.
inputs:
  action:
    description: acquire to take the slot, release to free it.
    required: true
  runner-prefix:
    description: The runner name prefix of the machines that hold a heavy slot. Other runners skip the call.
    required: true
  command:
    description: The slot command on those machines, called with the action as its one argument.
    required: true
runs:
  using: composite
  steps:
    # GitHub does not enforce required inputs, and an empty prefix would match every runner.
    - name: check the inputs
      shell: bash
      env:
        ACTION: ${{ inputs.action }}
        RUNNER_PREFIX: ${{ inputs.runner-prefix }}
        COMMAND: ${{ inputs.command }}
      run: |
        case "$ACTION" in
          acquire | release) ;;
          *) echo "::error::action must be acquire or release, not '$ACTION'"; exit 1 ;;
        esac
        if [ -z "$RUNNER_PREFIX" ] || [ -z "$COMMAND" ]; then
          echo "::error::heavy-slot needs runner-prefix and command"
          exit 1
        fi
    - if: startsWith(runner.name, inputs.runner-prefix)
      shell: bash
      env:
        ACTION: ${{ inputs.action }}
        COMMAND: ${{ inputs.command }}
      run: '"$COMMAND" "$ACTION"'
