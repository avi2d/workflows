name: lighthouse
description: Serve a built site, audit each of its pages with Lighthouse in a Chrome the action starts, write the median scores to the job summary and keep the reports as an artifact. No score fails the step.
inputs:
  site:
    description: The built folder to serve and audit.
    required: true
  runs:
    description: How many times to audit each page.
    default: "3"
  pages:
    description: The pages to audit, as paths such as / or /about/, separated by whitespace. Empty audits every .html page of the site.
    default: ""
  chrome-path:
    description: The Chrome to start. Empty takes the first of google-chrome-stable, google-chrome, chromium and chromium-browser on the PATH.
    default: ""
runs:
  using: composite
  steps:
    # Lighthouse needs Node 22.19 or later, and its command runs under whatever node the runner has.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    # The script resolves effect beside the repository root, and the caller's install holds it only by chance.
    - name: install the repository dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --ignore-scripts --cwd "$GITHUB_ACTION_PATH/../.."
    - name: install the pinned Lighthouse
      shell: bash
      run: bun install --frozen-lockfile --production --ignore-scripts --cwd "$GITHUB_ACTION_PATH/pinned"
    - name: audit each page and write the median scores to the summary
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        RUNS: ${{ inputs.runs }}
        PAGES: ${{ inputs.pages }}
        CHROME: ${{ inputs.chrome-path }}
        REPORTS: ${{ runner.temp }}/lighthouse-reports
      run: PATH="$GITHUB_ACTION_PATH/pinned/node_modules/.bin:$PATH" bun "$GITHUB_ACTION_PATH/main.ts"
    - name: keep the reports as an artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lighthouse-reports
        path: ${{ runner.temp }}/lighthouse-reports
        if-no-files-found: ignore
