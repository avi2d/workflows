name: pages-main-tip
description: Write the commit a branch points at, main by default, as the step output sha.
inputs:
  branch:
    description: The branch to read.
    default: main
  repository:
    description: The repository the branch lives in, as owner/name.
    default: ${{ github.repository }}
  token:
    description: The token that reads the repository.
    default: ${{ github.token }}
outputs:
  sha:
    description: The full commit SHA the branch points at.
    value: ${{ steps.tip.outputs.sha }}
runs:
  using: composite
  steps:
    - id: tip
      name: read the commit the branch points at
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
      run: bash "$GITHUB_ACTION_PATH/main.sh"
