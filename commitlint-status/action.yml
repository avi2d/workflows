name: commitlint-status
description: Report the outcome of the pull request title lint as the commitlint commit status.
inputs:
  outcome:
    description: The outcome of the title lint step, such as steps.title.outcome. Only success reports success.
    required: true
  head-sha:
    description: The commit the status lands on. Empty falls back to GITHUB_SHA.
    default: ${{ github.event.pull_request.head.sha }}
  token:
    description: The token that writes the status. It needs statuses write.
    default: ${{ github.token }}
  attempts:
    description: How many times to try the status call, waiting 10 seconds longer after each failure.
    default: "1"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        OUTCOME: ${{ inputs.outcome }}
        ATTEMPTS: ${{ inputs.attempts }}
      run: |
        case "$ATTEMPTS" in
          '' | *[!0-9]* | 0) echo "::error::attempts must be a whole number from 1, not '$ATTEMPTS'"; exit 1 ;;
        esac
        state=failure
        if [ "$OUTCOME" = success ]; then state=success; fi
        attempt=1
        until gh api "repos/$GITHUB_REPOSITORY/statuses/${HEAD_SHA:-$GITHUB_SHA}" -f state="$state" -f context=commitlint -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent; do
          if [ "$attempt" -ge "$ATTEMPTS" ]; then
            exit 1
          fi
          sleep "$((attempt * 10))"
          attempt=$((attempt + 1))
        done
