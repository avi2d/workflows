name: playwright
description: Restore the Playwright browser cache, install the named browsers, and install their system packages on a GitHub-hosted runner only.
inputs:
  browsers:
    description: The browsers to install, separated by spaces.
    default: webkit
  cache:
    description: Whether to restore and save ~/.cache/ms-playwright, keyed on the browsers and bun.lock.
    default: "true"
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -r -a names <<< "$BROWSERS"
        if [ "${#names[@]}" -eq 0 ]; then
          echo "::error::browsers names no browser"
          exit 1
        fi
        (IFS=-; echo "browsers=${names[*]}") >> "$GITHUB_OUTPUT"
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.key.outputs.browsers }}-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -r -a names <<< "$BROWSERS"
        attempt=1
        until bash "${{ github.action_path }}/attempt.sh" playwright-core install "${names[@]}"; do
          if [ "$attempt" -ge 3 ]; then
            echo "::error::playwright-core install failed or stalled on all 3 attempts, each stopped at 180 seconds"
            exit 1
          fi
          echo "playwright-core install attempt $attempt failed or stalled, retrying"
          sleep "$((attempt * 10))"
          attempt=$((attempt + 1))
        done
    # A self-hosted runner holds its system packages already, and installing them there needs root.
    - if: runner.environment == 'github-hosted'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -r -a names <<< "$BROWSERS"
        attempt=1
        until bash "${{ github.action_path }}/attempt.sh" playwright-core install-deps "${names[@]}"; do
          if [ "$attempt" -ge 3 ]; then
            echo "::error::playwright-core install-deps failed or stalled on all 3 attempts, each stopped at 180 seconds"
            exit 1
          fi
          echo "playwright-core install-deps attempt $attempt failed or stalled, retrying"
          sleep "$((attempt * 10))"
          attempt=$((attempt + 1))
        done
