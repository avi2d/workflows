name: head-status
description: Report a job's result as a commit status on the commit the run is for, or the one the caller names, since GitHub keeps a dispatched run's check off the pull request.
inputs:
  job-status:
    description: The job's status, passed as job.status. Only success reports success.
    required: true
  context:
    description: The status name, which a required check of the same name counts.
    default: ${{ github.job }}
  head-sha:
    description: The commit the status lands on. Empty falls back to GITHUB_SHA.
    default: ""
  description:
    description: The status description. Empty writes none.
    default: ""
  token:
    description: The token that writes the status. It needs statuses write.
    default: ${{ github.token }}
  attempts:
    description: How many times to try the status call, waiting 10 seconds longer after each failure.
    default: "1"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        JOB_STATUS: ${{ inputs.job-status }}
        CONTEXT: ${{ inputs.context }}
        HEAD_SHA: ${{ inputs.head-sha }}
        DESCRIPTION: ${{ inputs.description }}
        ATTEMPTS: ${{ inputs.attempts }}
      run: |
        case "$ATTEMPTS" in
          '' | *[!0-9]* | 0) echo "::error::attempts must be a whole number from 1, not '$ATTEMPTS'"; exit 1 ;;
        esac
        state=failure
        if [ "$JOB_STATUS" = success ]; then state=success; fi
        attempt=1
        until gh api "repos/$GITHUB_REPOSITORY/statuses/${HEAD_SHA:-$GITHUB_SHA}" -f state="$state" -f context="$CONTEXT" ${DESCRIPTION:+-f "description=$DESCRIPTION"} -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent; do
          if [ "$attempt" -ge "$ATTEMPTS" ]; then
            exit 1
          fi
          sleep "$((attempt * 10))"
          attempt=$((attempt + 1))
        done
